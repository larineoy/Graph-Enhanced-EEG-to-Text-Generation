# Configuration file for Graph-Enhanced EEG-to-Text Decoding

# Dataset
data:
  data_dir: "data"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  split_seed: 42
  max_seq_length: 64
  vocab_size: 50265

  apply_notch_filter: true
  notch_freq: 50.0
  apply_highpass_filter: true
  highpass_cutoff: 0.5
  detect_bad_channels: false
  bad_channel_threshold: 3.0

  # Sentence EEG is divided into W windows before STRG construction
  window_size_sec: 1.0
  window_stride_sec: 1.0
  max_windows: 16

# Model parameters
model:
  num_channels: 64
  num_frequency_bands: 5
  time_steps: 1000
  # 16 windows × 1 s × 250 Hz. Keeping 80 s copies of every sentence OOMs a laptop.
  max_eeg_length: 4000

  strg:
    k_spatial: 6
    k_functional: 6
    use_spatial_topology: true
    use_functional_connectivity: true
    use_frequency_nodes: true
    dynamic_functional: true

  stre:
    node_dim: 1
    graph_embed_dim: 256
    num_gat_layers: 2
    num_gat_heads: 4
    gat_dropout: 0.1
    num_temporal_layers: 4
    num_temporal_heads: 8
    temporal_ff_dim: 512
    temporal_dropout: 0.1

  decoder:
    pretrained_name: "facebook/bart-base"
    max_decoder_length: 64
    # Fine-tuning all of BART on 4k sentences collapses generation to one training line.
    freeze_pretrained: true
    freeze_encoder_only: true
    unfreeze_decoder_layers: true
    unfreeze_cross_attention: true

# Training
training:
  batch_size: 8
  num_epochs: 100
  learning_rate: 1.0e-5
  # STRG/STRE/projection learn faster than BART decoder
  eeg_lr_multiplier: 20.0
  weight_decay: 1e-5
  warmup_steps: 1000
  gradient_clip: 1.0
  dropout: 0.1
  # Paper uses teacher-forced generation loss only
  lambda_smooth: 0.0
  lambda_contrastive: 0.0
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  checkpoint_dir: "checkpoints"
  save_every: 5
  log_every: 100
  visualize_every: 10

# Evaluation
evaluation:
  metrics: ["bleu", "rouge", "wer", "bertscore"]
  beam_size: 5
  eval_generate_every: 5

# Hardware
device: "cuda"
# In-memory ZuCo cannot be forked: each worker copies ~all EEG arrays.
num_workers: 0
seed: 42
